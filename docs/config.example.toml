# diffler configuration. Every key is optional; values shown are the defaults.
#
# Layering, later wins per key:
#   1. built-in defaults
#   2. ~/.config/diffler/config.toml ($XDG_CONFIG_HOME respected, macOS included)
#   3. <repo>/.diffler/config.toml
#   4. CLI flags (--port, --no-mcp, --theme)
#
# Inspect the merged result and the origin of each value:
#   diffler config --dump

[ui]
# theme = "github-dark"
# Lines of unchanged code around each hunk; `+`/`-`/`=` change it live.
# context_lines = 3
# recent_commits = 10
# The status screen lists files as "list" (flat magit-style, one row per file
# with its full path) or "tree" (collapsible directories).
# status_file_layout = "list"
# The diff sidebar lists them as "tree" or "review": split into "To review" and
# a folded "Viewed" bucket, where an edited file falls back into "To review".
# `t` cycles the two live.
# diff_file_layout = "tree"
# Open the diff pane side-by-side (old left, new right); `|` toggles it live.
# side_by_side = false
# Emphasize what changed in the syntax tree, so a reindented or rewrapped block
# highlights only the tokens that differ. Set false for the textual engine.
# semantic_diff = true

[mcp]
# enabled = true
# port = 8417

[editor]
# Editor command; unset falls back to $DIFFLER_EDITOR, then $EDITOR.
# command = "nvim"

[ci]
# Which forge serves runs and pull requests. "auto" detects it from the
# remote; force it with "github", "gitlab", or "forgejo".
# provider = "auto"
# poll_seconds = 5

[ci.gitlab]
# Self-hosted instance, when the remote does not name it.
# host = "gitlab.example.com"

[ci.forgejo]
# Self-hosted instance; a forced forgejo provider targets codeberg.org without
# this.
# host = "codeberg.org"

# Key remaps per screen: action name -> chord. Chords are single keys ("q",
# "V"), ctrl combos ("<c-r>"), specials ("<cr>", "<tab>"), or two-key
# sequences ("cc", "gg"). Unlisted actions keep their built-in binding;
# `?` in the TUI shows the effective keymap.
#
# Motions are omitted below: j / k / gg / G and the paging keys, / n N to
# search, <c-k> for the command palette, ? for help, q to go back. `?` in the
# TUI lists what the screen you are on binds.

[keys.status]
# palette = "<c-k>"   # fuzzy command palette, bound on every screen
# stage = "s"
# unstage = "u"
# stage_all = "S"
# unstage_all = "U"
# discard = "x"
# mark_viewed = "v"
# next_section = "<c-n>"   # also "]", stepping the section and group headers
# prev_section = "<c-p>"   # also "["
# toggle_fold = "<tab>"
# open = "<cr>"
# open_review_diff = "D"
# open_runs = "o"
# switch_theme = "T"
# open_editor = "e"
# send_feedback = "Z"
# comments_overview = "C"
# open_file_picker = "<c-t>"   # fuzzy over every tracked file
# blame = "B"                  # blame the file under the cursor
# copy_url = "y"               # a pull request as its URL, a commit as its sha
# refresh = "<c-r>"

