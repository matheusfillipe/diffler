[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # chrono only reaches us through rmcp and schemars, and no maintained
  # release exists to move to yet
  { id = "RUSTSEC-2026-0543", reason = "transitive through rmcp and schemars, no upgrade available" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
