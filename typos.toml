[default]
# deliberate non-words that must stay verbatim: an RFC 4648 base64 test vector
# and a misspelled config key a test asserts the loader rejects
extend-ignore-re = [
  'base64\(b"fo"\)',
  '`ui\.thme`',
]

[default.extend-words]
ratatui = "ratatui"
# Stylus names its files .styl
styl = "styl"

[files]
# a snapshot is a rendered screen, where a popup's edge cuts words short
extend-exclude = ["*.snap", "demos/*/uv.lock", "demos/*/bun.lock", "Cargo.lock", "Formula/*", "bucket/*", "packaging/*", "flake.nix"]
