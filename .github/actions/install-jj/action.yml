name: Install jj
description: >
  Download a pinned jj release, check it against its published sha256, and put
  it on PATH. taiki-e/install-action has no jj entry and jj-cli carries no
  cargo-binstall metadata, so this fetches jj's own GitHub release asset.
runs:
  using: composite
  steps:
    - if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        version=0.45.1
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64) target=x86_64-unknown-linux-musl sha=f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72 ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl sha=7349a43dd5a20dbc998b10114daa0ee63d2ab863fb822c7eb6b0ebca5903cc69 ;;
          macOS-X64) target=x86_64-apple-darwin sha=6171582d0b5a98a1005cd9643faebff7936812ec264d7968a39d9cef3654a99b ;;
          macOS-ARM64) target=aarch64-apple-darwin sha=51ba42e3d0682616f6eb015045bfe45289b396f03511f9897f645ce8e9272743 ;;
          *)
            echo "no jj build for ${{ runner.os }}-${{ runner.arch }}" >&2
            exit 1
            ;;
        esac
        archive="$RUNNER_TEMP/jj.tar.gz"
        bin="$RUNNER_TEMP/jj-bin"
        curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${version}/jj-v${version}-${target}.tar.gz" -o "$archive"
        if command -v sha256sum >/dev/null; then
          echo "$sha  $archive" | sha256sum -c -
        else
          echo "$sha  $archive" | shasum -a 256 -c -
        fi
        mkdir -p "$bin"
        tar -xzf "$archive" -C "$bin" ./jj
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/jj" --version
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = "0.45.1"
        $sha = "5dbf2619272c897394d34190a94b21a6ab8d1e8e59fcf7dfc173d8fa8aa90bf0"
        $archive = Join-Path $env:RUNNER_TEMP "jj.zip"
        $bin = Join-Path $env:RUNNER_TEMP "jj-bin"
        Invoke-WebRequest -Uri "https://github.com/jj-vcs/jj/releases/download/v$version/jj-v$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
        if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $sha.ToUpper()) { throw "jj.zip checksum mismatch" }
        Expand-Archive -Path $archive -DestinationPath $bin
        Add-Content -Path $env:GITHUB_PATH -Value $bin
        & (Join-Path $bin "jj.exe") --version
