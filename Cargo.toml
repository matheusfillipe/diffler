[workspace]
resolver = "3"
members = ["crates/diffler", "crates/diffler-core"]

[workspace.package]
version = "0.18.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matheusfillipe/diffler"
homepage = "https://github.com/matheusfillipe/diffler"
authors = ["Matheus Fillipe"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["diff", "tui", "code-review", "mcp", "agents"]

[workspace.dependencies]
diffler-core = { path = "crates/diffler-core", version = "0.18.0" }
ratatui = "0.30"
async-trait = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net"] }
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
thiserror = "2"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
similar = { version = "3", features = ["inline", "unicode"] }
notify = "8.2"
notify-debouncer-full = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
rmcp = { version = "3", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
syndiff = "0.2"
# syndiff already depends on it, so the histogram algorithm adds no new crate
imara-diff = "0.2"
ratatui-image = { version = "=12.0.0-rc.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# we link grammars statically because the musl build cannot dlopen
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-sequel = "0.3"
tree-sitter-toml-ng = "0.7"
tree-sitter-hcl = "1.1"
tree-sitter-make = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-xml = "0.7"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.26"
tree-sitter-elixir = "0.3"
tree-sitter-zig = "1.1"
tree-sitter-haskell = "0.24"
tree-sitter-dart = "0.2"
tree-sitter-powershell = "0.26"
tree-sitter-svelte-ng = "1.0"
# the tree-sitter-dockerfile crate is stuck on an older tree-sitter major
arborium-dockerfile = "2.18"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
serde_norway = "0.9"
criterion = "0.8"
toml = "1"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
insta = "1.47"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
# two clippy lints we allow below exist only from rust 1.98 and 1.99, which is
# newer than the msrv
unknown_lints = { level = "allow", priority = -2 }
rust_2018_idioms = { level = "warn", priority = -1 }
# a pub item a private module keeps unreachable evades dead_code analysis
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# restriction lints we enforce
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
indexing_slicing = "warn"
# a nursery lint, so we name it on its own; it flags a function that grew a
# second job
cognitive_complexity = "warn"
# rmcp's tool_handler/prompt_handler expand into async trait impls that never
# await, where no `#[allow]` of ours reaches, so we allow it here
unused_async_trait_impl = "allow"
# pedantic lints we allow
assert_is_empty = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"

# line tables keep panic backtraces and cut target/debug about 3-4x
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
